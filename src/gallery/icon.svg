<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20232b"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.32" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rb" x1="0.05" y1="0.08" x2="0.95" y2="0.95">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="0.34" stop-color="#ff4d6d"/>
      <stop offset="0.66" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角底 + 左上高光 -->
  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#spec)" opacity="0.2"/>

  <!-- 多色光谱方块 + 玻璃高光 + 细高光边 -->
  <rect x="188" y="188" width="648" height="648" rx="190" fill="url(#rb)"/>
  <rect x="188" y="188" width="648" height="648" rx="190" fill="url(#gloss)"/>
  <rect x="190.5" y="190.5" width="643" height="643" rx="188" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5"/>
</svg>
