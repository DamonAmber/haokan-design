name: Release macOS dmg (x64)

# 发布策略（签名凭据不进 CI）：
#   - arm64（Apple Silicon）：由维护者在【本地】用 Developer ID 签名 + 公证后手动上传，
#     流程见 .kiro/steering/release-and-publish.md。
#   - x64（Intel）：本机为 arm64，无法本地打出 sharp 架构正确的 x64 包，因此交给本
#     workflow 在 Intel runner 上构建【未签名】dmg，自动发布到同一 tag 的 Release。
# 本 workflow 刻意不配置任何证书/Apple 凭据 Secrets——它只产未签名 x64 包。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: macos-13 # Intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build x64 dmg (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 明确不签名
        run: npm run dist -- --mac --x64 --publish never

      - name: List build output
        run: ls -la release || true

      - name: Publish x64 dmg to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.dmg.blockmap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
