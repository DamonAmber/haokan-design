<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20232b"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9edf2"/>
      <stop offset="1" stop-color="#a9afbc"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.35" cy="0.3" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lensClip"><circle cx="452" cy="452" r="280"/></clipPath>
  </defs>

  <!-- 深色圆角底 -->
  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#spec)" opacity="0.22"/>

  <!-- 放大镜手柄（位于镜片下层，仅镜圈外露出）-->
  <line x1="632" y1="632" x2="856" y2="856" stroke="#0b0c10" stroke-width="108" stroke-linecap="round" opacity="0.55"/>
  <line x1="636" y1="636" x2="848" y2="848" stroke="url(#handle)" stroke-width="82" stroke-linecap="round"/>
  <line x1="642" y1="642" x2="806" y2="806" stroke="#f4f6f9" stroke-width="18" stroke-linecap="round" opacity="0.65"/>

  <!-- 镜片内的色板 -->
  <g clip-path="url(#lensClip)">
    <rect x="172" y="150" width="140" height="604" fill="#f43f5e"/>
    <rect x="312" y="150" width="140" height="604" fill="#f59e0b"/>
    <rect x="452" y="150" width="140" height="604" fill="#14b8a6"/>
    <rect x="592" y="150" width="152" height="604" fill="#3b82f6"/>
    <ellipse cx="384" cy="356" rx="230" ry="168" fill="url(#spec)"/>
  </g>

  <!-- 镜圈 -->
  <circle cx="452" cy="452" r="300" fill="none" stroke="#f6f7f9" stroke-width="40"/>
  <circle cx="452" cy="452" r="279" fill="none" stroke="#0d0e12" stroke-width="3" opacity="0.35"/>
  <circle cx="452" cy="452" r="321" fill="none" stroke="#0d0e12" stroke-width="3" opacity="0.30"/>
</svg>
